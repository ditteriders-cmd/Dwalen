<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reisverhaal</title>
  <link rel="stylesheet" href="css/style.css?v=17">
</head>
<body>
  <div id="game">

    <div id="scene-wrapper">
      <img id="scene-img" src="" alt="scene" draggable="false">
      <div id="hotspots"></div>
      <div id="bird">
        <img id="bird-img" src="" alt="" draggable="false">
      </div>
    </div>

    <div id="title-overlay" class="hidden">
      <img src="illustrations/Title.png" alt="Title">
    </div>

    <div id="poem-scene">
      <div id="poem-text"></div>
    </div>

    <div id="closeup-overlay">
      <div id="closeup-text"></div>
    </div>

    <div id="fade"></div>

  </div>

  <div id="ui-buttons">
    <button id="home-btn" title="Terug naar start" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </button>
    <button id="mute-btn" title="Geluid aan/uit" aria-label="Geluid aan/uit">
      <svg id="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
      <svg id="icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="23" y1="9" x2="17" y2="15"/>
        <line x1="17" y1="9" x2="23" y2="15"/>
      </svg>
    </button>
  </div>

  <div id="cursor-arrow">
    <img id="cursor-img" src="" alt="">
  </div>

  <script src="js/game.js?v=21"></script>
</body>
</html>
